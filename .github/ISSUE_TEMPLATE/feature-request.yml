
name: Feature Request
description: Suggest an improvement or a new feature for SeaPorts.
title: "[Feature Request]: "
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this improvement be useful?
    validations:
      required: true

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Any examples or references?
    validations:
      required: false
